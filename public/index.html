<!DOCTYPE html>
<!-- ELECTRA v1.3.0 - Premium Edition -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTRA — Indian Election Intelligence Assistant</title>
    <meta name="description" content="AI-powered Indian Election Intelligence Assistant for citizens and first-time voters.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --saffron: #FF9933;
            --navy: #0D2167;
            --surface: #FDF8F4;
            --text: #1a1a2e;
        }
        body { font-family: 'Outfit', sans-serif; background-color: #F3F0EC; color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; }
        .app-shell { width: 100%; max-width: 480px; min-height: 100vh; background-color: var(--surface); box-shadow: 0 0 50px rgba(0,0,0,0.08); position: relative; display: flex; flex-direction: column; overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        
        .premium-nav { background-color: var(--saffron); border-radius: 40px; margin: 10px 16px; padding: 6px; display: flex; justify-content: space-between; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 30px; transition: all 0.3s; color: rgba(255,255,255,0.8); }
        .nav-item.active { background-color: white; color: var(--navy); }
        .nav-item svg { width: 20px; height: 20px; }
        .nav-item span { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

        .bubble-user { background-color: var(--saffron); color: white; border-radius: 20px 20px 0 20px; padding: 12px 18px; font-size: 14px; box-shadow: 0 4px 12px rgba(255, 153, 51, 0.2); }
        .bubble-electra { background-color: white; color: var(--text); border-radius: 20px 20px 20px 0; padding: 16px; font-size: 14px; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 10px 25px rgba(0,0,0,0.03); }
        
        .welcome-card { background-color: white; border-radius: 32px; padding: 32px; margin-bottom: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); text-align: center; }
        .guide-me-btn { background-color: var(--navy); color: white; border-radius: 50px; padding: 14px 28px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; box-shadow: 0 10px 20px rgba(13, 33, 103, 0.2); }

        .chip { background-color: white; border: 1px solid #EEE0D5; border-radius: 50px; padding: 8px 16px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: all 0.2s; cursor: pointer; }
        .chip:hover { border-color: var(--saffron); transform: translateY(-1px); }
        .chip-icon { width: 16px; height: 16px; opacity: 0.5; }

        .input-bar-container { position: sticky; bottom: 0; padding: 16px; background: linear-gradient(to top, var(--surface) 80%, transparent); z-index: 100; }
        .history-btn { background-color: #ECE7E2; border-radius: 50px; padding: 6px 16px; font-size: 12px; font-weight: 600; color: #555; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 12px; }
        .input-pill { background-color: white; border-radius: 50px; padding: 6px 10px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); }
        .send-btn-circle { width: 44px; height: 44px; background-color: var(--navy); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; transition: transform 0.2s; }
        
        .onboarding-screen { position: absolute; inset: 0; z-index: 200; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader-chakra { animation: spin 4s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .scroll-hide::-webkit-scrollbar { display: none; }
        .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div class="app-shell scroll-hide">
        <header class="p-4 flex items-center justify-between bg-transparent">
            <div class="flex items-center gap-2">
                <svg class="w-6 h-6 text-navy loader-chakra" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="6" /><circle cx="50" cy="50" r="10" fill="currentColor" /></svg>
                <span class="text-xl font-bold tracking-tight text-navy">ELECTRA</span>
            </div>
            <div class="flex flex-col items-end">
                <div class="w-8 h-8 bg-navy text-white rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg></div>
                <div class="text-[8px] font-bold text-gray-400 mt-1 uppercase tracking-widest" id="progress-text">EXPLORED 0 OF 8 TOPICS</div>
            </div>
        </header>

        <nav class="premium-nav">
            <button onclick="switchTab('chat')" id="tab-chat" class="nav-item active"><svg fill="currentColor" viewBox="0 0 20 20"><path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm3 2a1 1 0 000 2h10a1 1 0 100-2H5zm0 4a1 1 0 100 2h7a1 1 0 100-2H5z"/></svg><span>Chat</span></button>
            <button onclick="switchTab('timeline')" id="tab-timeline" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"/></svg><span>Timeline</span></button>
            <button onclick="switchTab('eligibility')" id="tab-eligibility" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/></svg><span>Eligible</span></button>
            <button onclick="switchTab('maps')" id="tab-maps" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg><span>Booth</span></button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg><span>Quiz</span></button>
        </nav>

        <main id="main-content" class="flex-grow p-4 overflow-y-auto scroll-hide">
            <div id="onboarding" class="onboarding-screen hidden">
                <div class="welcome-card w-full">
                    <h2 class="text-2xl font-bold mb-2">Welcome to ELECTRA</h2>
                    <p class="text-sm text-gray-500 mb-8">I'll guide you through the Indian election process.</p>
                    <div class="space-y-3">
                        <button onclick="startOnboarding('I am a first-time voter')" class="w-full py-4 bg-navy text-white rounded-2xl font-bold">I'm a first-time voter</button>
                        <button onclick="startOnboarding('I want to understand the process')" class="w-full py-4 bg-gray-50 border border-gray-100 rounded-2xl font-bold">I want to understand the process</button>
                    </div>
                </div>
            </div>

            <section id="content-chat" class="flex flex-col h-full">
                <div id="chat-messages" class="flex flex-col gap-6 pb-4">
                    <div class="welcome-card fade-in">
                        <h2 class="text-3xl font-bold text-navy mb-4">Welcome! I'm here to help with any election questions.</h2>
                        <button onclick="startGuidedJourney()" class="guide-me-btn">🚀 Guide Me (10 Steps)</button>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div onclick="sendQuickChip('Am I Eligible?')" class="chip"><span>Am I Eligible?</span></div>
                        <div onclick="sendQuickChip('Where is my Booth?')" class="chip"><span>Where is my Booth?</span></div>
                    </div>
                </div>
            </section>
            
            <!-- Other Sections -->
            <section id="content-timeline" class="hidden"><div class="space-y-4" id="timeline-container"></div></section>
            <section id="content-eligibility" class="hidden"><div class="welcome-card"><h2 class="text-2xl font-bold mb-6">Are you eligible?</h2><form id="eligibility-form" class="space-y-4"><select id="el-state" class="w-full p-4 bg-gray-50 rounded-2xl border-none"><option value="">Select State</option><option value="Delhi">Delhi</option></select><input type="number" id="el-age" placeholder="Age" class="w-full p-4 bg-gray-50 rounded-2xl border-none"><button type="submit" class="w-full py-4 bg-navy text-white rounded-2xl font-bold">Verify Now</button></form><div id="eligibility-result" class="hidden mt-6 p-4 rounded-2xl"></div></div></section>
            <section id="content-maps" class="hidden"><div class="mb-4 flex gap-2"><input type="text" id="pincode-input" placeholder="Pincode" maxlength="6" class="flex-grow p-3 bg-white rounded-2xl border"><button id="pincode-btn" class="bg-navy text-white px-6 rounded-2xl font-bold">Find</button></div><div id="map" class="w-full h-64 rounded-3xl bg-gray-200"></div></section>
            <section id="content-quiz" class="hidden"><div id="quiz-intro" class="text-center py-8"><h2 class="text-2xl font-bold mb-4">Voter Quiz</h2><button onclick="startQuiz('Voting')" class="w-full p-4 bg-white border rounded-2xl font-bold">Start Quiz</button></div><div id="quiz-container" class="hidden space-y-4"><div id="quiz-question" class="text-lg font-bold"></div><div id="quiz-options" class="space-y-2"></div><div id="quiz-explanation" class="hidden p-4 rounded-2xl bg-blue-50"></div><button id="quiz-next" class="hidden w-full py-4 bg-navy text-white rounded-2xl">Next</button></div></section>
        </main>

        <div class="input-bar-container">
            <div class="flex justify-between items-end mb-2">
                <div class="flex gap-2">
                    <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100">⋮</button>
                </div>
                <button onclick="toggleHistory()" class="history-btn">Chat History »</button>
            </div>
            <div class="input-pill">
                <button id="voice-btn" class="p-2 text-gray-400">🎤</button>
                <input type="text" id="chat-input" placeholder="Ask ELECTRA..." autocomplete="off" class="flex-grow p-2 focus:outline-none text-sm bg-transparent">
                <button id="send-btn" class="send-btn-circle">➤</button>
            </div>
        </div>

        <button id="myth-fab" style="bottom: 120px;" class="fixed right-6 w-14 h-14 bg-red-600 text-white rounded-full flex items-center justify-center shadow-2xl z-50">⚠️</button>
        
        <div id="myth-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
            <div class="bg-white w-full max-w-sm rounded-[2.5rem] shadow-2xl p-6">
                <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold">Myth Buster</h2><button id="close-myth">✕</button></div>
                <textarea id="myth-input" placeholder="Enter claim..." class="w-full p-4 bg-gray-50 rounded-2xl mb-4 h-32 border-none"></textarea>
                <button id="verify-myth" class="w-full py-4 bg-red-600 text-white rounded-2xl font-bold">Verify Claim</button>
                <div id="myth-result" class="hidden mt-4 p-4 rounded-2xl text-xs"></div>
            </div>
        </div>
    </div>

    <script>
        // GLOBAL STATE
        let chatInput, sendBtn, chatMessages;
        let currentLang = localStorage.getItem('lang') || 'en';
        let chatHistory = [];
        let exploredTopics = JSON.parse(localStorage.getItem('exploredTopics') || '[]');

        const guidedSteps = ["What is an election?", "Who can vote?", "How to register?", "Finding booth", "Documents needed", "Using EVM", "VVPAT", "NOTA", "Results", "Myths"];
        let currentStep = -1;

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            chatInput = document.getElementById('chat-input');
            sendBtn = document.getElementById('send-btn');
            chatMessages = document.getElementById('chat-messages');

            if(sendBtn) sendBtn.onclick = handleChat;
            if(chatInput) chatInput.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); handleChat(); } };

            checkOnboarding();
            updateProgress();
            
            // Myth modal logic
            const mythFab = document.getElementById('myth-fab');
            const mythModal = document.getElementById('myth-modal');
            const closeMyth = document.getElementById('close-myth');
            if(mythFab) mythFab.onclick = () => mythModal.classList.remove('hidden');
            if(closeMyth) closeMyth.onclick = () => mythModal.classList.add('hidden');
        });

        async function handleChat() {
            const text = chatInput.value.trim();
            if(!text) return;
            
            addMessage('user', text);
            chatInput.value = '';
            
            const typing = document.createElement('div');
            typing.className = 'text-[10px] text-gray-400 ml-4 animate-pulse';
            typing.innerText = 'ELECTRA is thinking...';
            chatMessages.appendChild(typing);
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory, message: text, language: currentLang })
                });
                
                if (typing.parentNode) chatMessages.removeChild(typing);
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let electraMsg = '';
                const bubble = addMessage('electra', '');
                
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') break;
                            try {
                                const parsed = JSON.parse(data);
                                electraMsg += parsed.text;
                                bubble.innerHTML = formatText(electraMsg);
                                scrollToBottom();
                            } catch(e) {}
                        }
                    }
                }
                chatHistory.push({ role: 'user', parts: [{ text }] }, { role: 'model', parts: [{ text: electraMsg }] });
            } catch (error) {
                if (typing.parentNode) chatMessages.removeChild(typing);
                addMessage('electra', 'Connection error. Please try again.');
            }
        }

        function addMessage(sender, text) {
            if (!chatMessages) return null;
            const div = document.createElement('div');
            div.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'} fade-in mb-4`;
            const bubble = document.createElement('div');
            bubble.className = sender === 'user' ? 'bubble-user' : 'bubble-electra';
            bubble.style.maxWidth = '85%';
            bubble.innerHTML = formatText(text);
            div.appendChild(bubble);
            chatMessages.appendChild(div);
            scrollToBottom();
            return bubble;
        }

        function scrollToBottom() {
            const main = document.getElementById('main-content');
            if(main) main.scrollTop = main.scrollHeight;
        }

        function formatText(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                       .replace(/\*\*(.*?)\*\*/g, '<span class="font-bold text-navy">$1</span>')
                       .replace(/\n/g, '<br>');
        }

        function sendQuickChip(text) { 
            if(chatInput) { chatInput.value = text; handleChat(); }
        }

        function switchTab(tabId) {
            document.querySelectorAll('section[id^="content-"]').forEach(s => s.classList.add('hidden'));
            const target = document.getElementById(`content-${tabId}`);
            if(target) target.classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            const tabBtn = document.getElementById(`tab-${tabId}`);
            if(tabBtn) tabBtn.classList.add('active');
            if(tabId === 'timeline') loadTimeline();
        }

        function startGuidedJourney() {
            currentStep = 0;
            updateStep();
        }

        function updateStep() {
            if (currentStep < 0 || currentStep >= guidedSteps.length) return;
            sendQuickChip(`Step ${currentStep + 1}: ${guidedSteps[currentStep]}. Explain this.`);
            setTimeout(() => {
                const bubbles = document.querySelectorAll('.bubble-electra');
                const last = bubbles[bubbles.length - 1];
                if (last) {
                    const btn = document.createElement('button');
                    btn.className = "mt-4 block text-[10px] font-bold text-navy underline";
                    btn.innerText = currentStep < 9 ? "Continue Journey" : "Complete!";
                    btn.onclick = () => { currentStep++; if(currentStep < 10) updateStep(); else currentStep = -1; };
                    last.appendChild(btn);
                }
            }, 3000);
        }

        async function loadTimeline() {
            const res = await fetch('/api/timeline');
            const data = await res.json();
            const container = document.getElementById('timeline-container');
            if(!container) return;
            container.innerHTML = '';
            data.forEach((item) => {
                const card = document.createElement('button');
                card.className = "w-full text-left p-4 bg-white border border-gray-100 rounded-2xl mb-3";
                card.innerHTML = `<div class="text-[10px] font-bold text-orange-600">${item.date}</div><div class="text-sm font-bold">${item.stage}</div><p class="text-[10px] text-gray-500">${item.detail}</p>`;
                card.onclick = () => { switchTab('chat'); sendQuickChip(`Tell me about ${item.stage}.`); };
                container.appendChild(card);
            });
        }

        function startOnboarding(selection) { localStorage.setItem('onboarded', 'true'); document.getElementById('onboarding').classList.add('hidden'); sendQuickChip(selection); }
        function checkOnboarding() { if (!localStorage.getItem('onboarded')) document.getElementById('onboarding').classList.remove('hidden'); }
        function updateProgress() { document.getElementById('progress-text').innerText = `EXPLORED ${exploredTopics.length} OF 8 TOPICS`; }
    </script>
</body>
</html>
